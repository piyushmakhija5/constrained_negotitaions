<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNB — Three Cost Constraints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Caveat', cursive;
    background: #faf9f6; color: #0f172a;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  #header {
    background: #0f172a; padding: 0 32px; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #header h1 { font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; color: #94a3b8; }
  #header h1 strong { color: white; font-weight: 700; }
  .scenario-tag {
    font-family: 'Caveat', cursive; font-size: 16px; font-weight: 600;
    color: #64748b; background: rgba(255,255,255,0.06);
    padding: 4px 14px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1);
  }

  #content {
    flex: 1; display: flex; flex-direction: column;
    padding: 20px 28px 16px; gap: 16px; overflow: hidden;
  }

  .cards-row { display: flex; gap: 16px; flex: 1; min-height: 0; }

  .chart-card {
    flex: 1; background: #faf9f6; border-radius: 10px;
    border: 3px solid #0f172a;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .card-top {
    padding: 14px 20px 10px;
    border-bottom: 2px solid #d6d3d1;
    display: flex; align-items: baseline; gap: 10px;
  }
  .card-top h2 { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .card-top .sub { font-family: 'Caveat', cursive; font-size: 17px; font-weight: 600; color: #475569; }
  .card-top.c-otif h2 { color: #a16207; }
  .card-top.c-det h2 { color: #1d4ed8; }
  .card-top.c-hos h2 { color: #b91c1c; }

  .card-body { flex: 1; padding: 6px 8px 8px; display: flex; }
  .card-body svg { width: 100%; height: 100%; }

  .combined-card {
    background: #faf9f6; border-radius: 10px; border: 3px solid #0f172a;
    display: flex; flex-direction: column; flex: 1.1; min-height: 0; overflow: hidden;
  }
  .combined-header {
    padding: 12px 20px 8px;
    border-bottom: 2px solid #d6d3d1;
    display: flex; align-items: center; justify-content: space-between;
  }
  .combined-header h2 { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #0f172a; }
  .combined-legend { display: flex; gap: 16px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; color: #475569; }
  .legend-swatch { width: 18px; height: 5px; border-radius: 2px; }

  .combined-body { flex: 1; padding: 4px 8px 8px; display: flex; }
  .combined-body svg { width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="header">
  <h1><strong>ConstrainedNegotiationBench</strong> &mdash; Three Constraints That Shape Every Decision</h1>
  <div class="scenario-tag">SM-2-4-FR-ASYM-NEU</div>
</div>

<div id="content">
  <div class="cards-row">
    <div class="chart-card" id="card-otif">
      <div class="card-top c-otif">
        <h2>OTIF Penalty</h2>
        <div class="sub">Binary &mdash; $10K if late</div>
      </div>
      <div class="card-body"><svg id="svg-otif" viewBox="0 0 420 220"></svg></div>
    </div>
    <div class="chart-card" id="card-det">
      <div class="card-top c-det">
        <h2>Detention Cost</h2>
        <div class="sub">Linear &mdash; $100 / hour</div>
      </div>
      <div class="card-body"><svg id="svg-det" viewBox="0 0 420 220"></svg></div>
    </div>
    <div class="chart-card" id="card-hos">
      <div class="card-top c-hos">
        <h2>Hours of Service</h2>
        <div class="sub">Hard wall &mdash; illegal after deadline</div>
      </div>
      <div class="card-body"><svg id="svg-hos" viewBox="0 0 420 220"></svg></div>
    </div>
  </div>

  <div class="combined-card" id="card-combined">
    <div class="combined-header">
      <h2>Combined: Total Cost by Dock Slot</h2>
      <div class="combined-legend">
        <div class="legend-item"><div class="legend-swatch" style="background:#a16207"></div>OTIF</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#1d4ed8"></div>Detention</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#0f172a"></div>Total</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#b91c1c;width:4px;height:16px;border-radius:0"></div>HOS Wall</div>
      </div>
    </div>
    <div class="combined-body"><svg id="svg-combined" viewBox="0 0 1100 250"></svg></div>
  </div>
</div>

<script>
// ── Data ──
const SLOTS = [
  {time:780,label:'13:00',otif:0,det:0,total:0,feasible:true},
  {time:810,label:'13:30',otif:0,det:0,total:0,feasible:true},
  {time:870,label:'14:30',otif:10000,det:100,total:10100,feasible:true},
  {time:960,label:'16:00',otif:10000,det:200,total:10200,feasible:false},
  {time:1020,label:'17:00',otif:10000,det:300,total:10300,feasible:false},
  {time:1140,label:'19:00',otif:10000,det:500,total:10500,feasible:false},
  {time:1170,label:'19:30',otif:10000,det:600,total:10600,feasible:false},
  {time:1200,label:'20:00',otif:10000,det:600,total:10600,feasible:false},
];
const OTIF_DL=840, DET_START=840, HOS_DL=900;

// ── Wobbly path helpers ──
function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// Convert array of [x,y] points into a wobbly SVG path string
function wp(pts, seed) {
  if (pts.length === 0) return '';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const x0 = pts[i-1][0], y0 = pts[i-1][1];
    const x1 = pts[i][0], y1 = pts[i][1];
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 2) {
      d += ` L ${x1.toFixed(1)},${y1.toFixed(1)}`;
      continue;
    }
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    // Perpendicular wobble, proportional to segment length, capped at ±4px
    const wobAmt = Math.min(4, len * 0.06);
    const h1 = hash(seed + i * 17 + 3) * 2 - 1;  // -1 to 1
    const h2 = hash(seed + i * 31 + 7) * 2 - 1;
    // Perpendicular direction
    const nx = -dy / len, ny = dx / len;
    const cx1 = mx + nx * wobAmt * h1;
    const cy1 = my + ny * wobAmt * h2;
    d += ` Q ${cx1.toFixed(1)},${cy1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return d;
}

// Single wobbly line
function wl(x1, y1, x2, y2, seed) {
  return wp([[x1,y1],[x2,y2]], seed);
}

// ── Mini chart bounds ──
const B = { l:55, r:405, t:15, b:185 };
const TMIN=750, TMAX=1230;
function tx(t){ return B.l+(t-TMIN)/(TMAX-TMIN)*(B.r-B.l); }

const miniTicks = [
  {t:780,l:'13:00'},{t:900,l:'15:00'},{t:1020,l:'17:00'},{t:1140,l:'19:00'}
];

function axisHTML(costMax, costStep, costFmt) {
  let h = '';
  // Wobbly X axis
  h += `<path d="${wl(B.l, B.b, B.r, B.b, 100)}" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  // Wobbly Y axis
  h += `<path d="${wl(B.l, B.b, B.l, B.t, 101)}" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  // Horizontal grid + y labels
  for (let v = 0; v <= costMax; v += costStep) {
    const y = B.b - (v/costMax)*(B.b-B.t);
    if (v > 0) h += `<path d="${wl(B.l, y, B.r, y, 200+v)}" stroke="#d6d3d1" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
    h += `<text x="${B.l-8}" y="${y+4}" text-anchor="end"
      font-family="Caveat" font-size="15" font-weight="600" fill="#475569">${costFmt(v)}</text>`;
  }
  // X ticks
  miniTicks.forEach((tk, i) => {
    h += `<text x="${tx(tk.t)}" y="${B.b+18}" text-anchor="middle"
      font-family="Caveat" font-size="15" font-weight="600" fill="#475569">${tk.l}</text>`;
  });
  // Axis titles
  h += `<text x="${(B.l+B.r)/2}" y="${B.b+35}" text-anchor="middle"
    font-family="Caveat" font-size="14" font-weight="700" fill="#475569">Dock Time</text>`;
  h += `<text x="14" y="${(B.t+B.b)/2}" text-anchor="middle"
    font-family="Caveat" font-size="14" font-weight="700" fill="#475569"
    transform="rotate(-90, 14, ${(B.t+B.b)/2})">Cost</text>`;
  return h;
}

// ── OTIF Chart ──
function buildOtif() {
  const svg = document.getElementById('svg-otif');
  const maxY = 12000;
  const cy = v => B.b-(v/maxY)*(B.b-B.t);
  const fmt = v => v===0?'$0':'$'+(v/1000)+'K';

  let h = axisHTML(maxY, 4000, fmt);

  // Step function points
  const stepPts = [
    [tx(TMIN), cy(0)],
    [tx(OTIF_DL), cy(0)],
    [tx(OTIF_DL), cy(10000)],
    [tx(TMAX), cy(10000)]
  ];
  h += `<path d="${wp(stepPts, 42)}" stroke="#a16207" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

  // Light amber fill for penalty zone
  h += `<rect x="${tx(OTIF_DL)}" y="${cy(10000)}" width="${B.r-tx(OTIF_DL)}" height="${cy(0)-cy(10000)}"
    fill="#eab308" opacity="0.08"/>`;

  // Vertical deadline marker (wobbly dashed)
  h += `<path d="${wl(tx(OTIF_DL), B.t, tx(OTIF_DL), B.b, 43)}"
    stroke="#a16207" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round" fill="none"/>`;

  // "$10,000" annotation
  h += `<text x="${tx(OTIF_DL)+16}" y="${cy(10000)+24}"
    font-family="Caveat" font-size="22" font-weight="700" fill="#a16207">$10,000</text>`;

  // "OTIF Deadline" label
  h += `<text x="${tx(OTIF_DL)}" y="${B.t-6}" text-anchor="middle"
    font-family="Caveat" font-size="16" font-weight="700" fill="#a16207">OTIF Deadline</text>`;

  svg.innerHTML = h;
}

// ── Detention Chart ──
function buildDet() {
  const svg = document.getElementById('svg-det');
  const maxY = 700;
  const cy = v => B.b-(v/maxY)*(B.b-B.t);
  const fmt = v => v===0?'$0':'$'+v;

  let h = axisHTML(maxY, 200, fmt);

  // Compute staircase step points explicitly
  const pts = [];
  // Flat zero before meter starts
  pts.push([tx(TMIN), cy(0)]);
  pts.push([tx(DET_START), cy(0)]);
  // Staircase: each hour boundary steps up $100
  const maxT = Math.min(TMAX, DET_START + 7 * 60); // enough for full range
  for (let hr = 1; hr <= 7; hr++) {
    const stepTime = DET_START + hr * 60;
    if (stepTime > TMAX) break;
    const prevCost = (hr - 1) * 100;
    const cost = hr * 100;
    // Vertical rise just after boundary
    pts.push([tx(DET_START + (hr-1)*60 + 1), cy(Math.min(prevCost, 700))]);
    pts.push([tx(DET_START + (hr-1)*60 + 1), cy(Math.min(cost, 700))]);
    // Horizontal to next boundary
    const nextBound = Math.min(DET_START + hr * 60, TMAX);
    pts.push([tx(nextBound), cy(Math.min(cost, 700))]);
  }

  // Fill area under curve
  const fillPts = [[tx(TMIN), cy(0)], ...pts.slice(1), [pts[pts.length-1][0], cy(0)]];
  let fillD = `M ${fillPts[0][0].toFixed(1)},${fillPts[0][1].toFixed(1)}`;
  for (let i = 1; i < fillPts.length; i++) fillD += ` L ${fillPts[i][0].toFixed(1)},${fillPts[i][1].toFixed(1)}`;
  fillD += ' Z';
  h += `<path d="${fillD}" fill="#2563eb" opacity="0.06"/>`;

  // Wobbly staircase line
  h += `<path d="${wp(pts, 55)}" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

  // Vertical start marker (wobbly dashed)
  h += `<path d="${wl(tx(DET_START), B.t, tx(DET_START), B.b, 56)}"
    stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round" fill="none"/>`;

  // "Meter starts" label
  h += `<text x="${tx(DET_START)}" y="${B.t-6}" text-anchor="middle"
    font-family="Caveat" font-size="16" font-weight="700" fill="#1d4ed8">Meter starts</text>`;

  // "$100/hr" annotation
  h += `<text x="${tx(DET_START + 120)}" y="${cy(400)}"
    font-family="Caveat" font-size="22" font-weight="700" fill="#1d4ed8">$100/hr</text>`;

  svg.innerHTML = h;
}

// ── HOS Chart ──
function buildHos() {
  const svg = document.getElementById('svg-hos');
  const maxY = 12000;
  const cy = v => B.b-(v/maxY)*(B.b-B.t);
  const fmt = v => v===0?'$0':'$'+(v/1000)+'K';

  let h = axisHTML(maxY, 4000, fmt);

  // Light red fill for infeasible zone
  h += `<rect x="${tx(HOS_DL)}" y="${cy(maxY)}" width="${B.r-tx(HOS_DL)}" height="${cy(0)-cy(maxY)}"
    fill="#dc2626" opacity="0.08"/>`;

  // Flat $0 line up to HOS deadline (wobbly)
  h += `<path d="${wp([[tx(TMIN),cy(0)],[tx(HOS_DL),cy(0)]], 70)}"
    stroke="#b91c1c" stroke-width="5" stroke-linecap="round" fill="none"/>`;

  // Vertical wall shooting up (wobbly)
  h += `<path d="${wp([[tx(HOS_DL),cy(0)],[tx(HOS_DL),cy(maxY)]], 71)}"
    stroke="#b91c1c" stroke-width="5" stroke-linecap="round" fill="none"/>`;

  // Dashed continuation at top (wobbly)
  h += `<path d="${wp([[tx(HOS_DL),cy(maxY)],[tx(TMAX),cy(maxY)]], 72)}"
    stroke="#b91c1c" stroke-width="4" stroke-dasharray="8,5" stroke-linecap="round" fill="none"/>`;

  // "HOS Deadline" label
  h += `<text x="${tx(HOS_DL)}" y="${B.t-6}" text-anchor="middle"
    font-family="Caveat" font-size="16" font-weight="700" fill="#b91c1c">HOS Deadline</text>`;

  // "ILLEGAL" annotation
  h += `<text x="${tx(HOS_DL)+20}" y="${cy(maxY)+28}"
    font-family="Caveat" font-size="24" font-weight="700" fill="#dc2626">ILLEGAL</text>`;

  svg.innerHTML = h;
}

// ── Combined Chart ──
function buildCombined() {
  const svg = document.getElementById('svg-combined');
  const C = {l:60,r:1065,t:12,b:215};
  const maxCost=11500;

  const cx=t=>C.l+(t-TMIN)/(TMAX-TMIN)*(C.r-C.l);
  const cy=v=>C.b-(v/maxCost)*(C.b-C.t);

  function getOtif(t){return t>OTIF_DL?10000:0;}
  function getDet(t){return t<=DET_START?0:Math.ceil((t-DET_START)/60)*100;}
  function getTotal(t){return getOtif(t)+getDet(t);}

  const totalPts=[],otifPts=[];
  for(let t=TMIN;t<=HOS_DL;t+=2){
    totalPts.push([cx(t),cy(getTotal(t))]);
    otifPts.push([cx(t),cy(getOtif(t))]);
  }
  const infPts=[];
  for(let t=HOS_DL;t<=TMAX;t+=2) infPts.push([cx(t),cy(getTotal(t))]);

  // Polygon fill areas (straight — they look like watercolor wash on cream)
  const otifArea=[`${cx(TMIN)},${cy(0)}`];
  otifPts.forEach(p => otifArea.push(`${p[0].toFixed(1)},${p[1].toFixed(1)}`));
  otifArea.push(`${cx(HOS_DL)},${cy(0)}`);

  const detTop=[];
  for(let t=TMIN;t<=HOS_DL;t+=2) detTop.push(`${cx(t).toFixed(1)},${cy(getTotal(t)).toFixed(1)}`);
  const detBot=[];
  for(let t=HOS_DL;t>=TMIN;t-=2) detBot.push(`${cx(t).toFixed(1)},${cy(getOtif(t)).toFixed(1)}`);

  const timeTicks=[
    {t:780,l:'13:00'},{t:840,l:'14:00'},{t:900,l:'15:00'},
    {t:960,l:'16:00'},{t:1020,l:'17:00'},{t:1140,l:'19:00'},{t:1200,l:'20:00'}
  ];
  const costTicks=[0,2000,4000,6000,8000,10000];

  let h = '';

  // Wobbly axes
  h += `<path d="${wl(C.l, C.b, C.r, C.b, 300)}" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  h += `<path d="${wl(C.l, C.b, C.l, C.t, 301)}" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>`;

  // Grid + labels
  costTicks.forEach(c => {
    h+=`<path d="${wl(C.l, cy(c), C.r, cy(c), 400+c)}" stroke="#d6d3d1" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
    const lb=c===0?'$0':'$'+(c/1000)+'K';
    h+=`<text x="${C.l-8}" y="${cy(c)+5}" text-anchor="end"
      font-family="Caveat" font-size="15" font-weight="600" fill="#475569">${lb}</text>`;
  });
  timeTicks.forEach(tk => {
    h+=`<text x="${cx(tk.t)}" y="${C.b+18}" text-anchor="middle"
      font-family="Caveat" font-size="15" font-weight="600" fill="#475569">${tk.l}</text>`;
    h+=`<path d="${wl(cx(tk.t), C.t, cx(tk.t), C.b, 500+tk.t)}" stroke="#d6d3d1" stroke-width="1" stroke-linecap="round" fill="none"/>`;
  });

  // Infeasible bg
  h+=`<rect x="${cx(HOS_DL)}" y="${C.t}" width="${C.r-cx(HOS_DL)}" height="${C.b-C.t}"
    fill="#dc2626" opacity="0.04"/>`;

  // OTIF fill (amber)
  h+=`<polygon points="${otifArea.join(' ')}" fill="#eab308" opacity="0.12"/>`;

  // Detention fill (blue)
  h+=`<polygon points="${detTop.join(' ')} ${detBot.join(' ')}" fill="#2563eb" opacity="0.12"/>`;

  // OTIF line (wobbly)
  h+=`<path d="${wp(otifPts, 80)}" stroke="#a16207" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>`;

  // Total line (wobbly)
  h+=`<path d="${wp(totalPts, 81)}" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

  // Infeasible dashed (wobbly)
  h+=`<path d="${wp(infPts, 82)}" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8,5"
    stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

  // HOS wall (thick wobbly)
  h+=`<path d="${wl(cx(HOS_DL), C.t-4, cx(HOS_DL), C.b+4, 83)}"
    stroke="#b91c1c" stroke-width="5" stroke-linecap="round" fill="none"/>`;
  h+=`<text x="${cx(HOS_DL)+12}" y="${C.t+16}"
    font-family="Caveat" font-size="16" font-weight="700" fill="#b91c1c">HOS WALL</text>`;

  // Slot dots
  SLOTS.forEach((s,i) => {
    const sx=cx(s.time), sy=cy(s.total);
    const col=s.feasible?'#0f172a':'#94a3b8';
    const r=(s.label==='13:00'||s.label==='14:30')?7:5;
    h+=`<circle cx="${sx}" cy="${sy}" r="${r}" fill="${col}"/>`;

    if(s.label==='13:00'){
      h+=`<text x="${sx}" y="${sy+22}" text-anchor="middle"
        font-family="Caveat" font-size="20" font-weight="700" fill="#047857">$0</text>`;
      h+=`<text x="${sx}" y="${sy+37}" text-anchor="middle"
        font-family="Caveat" font-size="14" font-weight="700" fill="#047857">OPTIMAL</text>`;
    }
    if(s.label==='14:30'){
      h+=`<text x="${sx+12}" y="${sy-14}" text-anchor="start"
        font-family="Caveat" font-size="20" font-weight="700" fill="#dc2626">$10,100</text>`;
      h+=`<text x="${sx+12}" y="${sy}" text-anchor="start"
        font-family="Caveat" font-size="14" font-weight="700" fill="#dc2626">ACTUAL DEAL</text>`;
    }
  });

  // "INFEASIBLE" watermark
  h+=`<text x="${(cx(HOS_DL)+C.r)/2}" y="${(C.t+C.b)/2}" text-anchor="middle"
    font-family="Caveat" font-size="26" font-weight="700" fill="#dc2626" opacity="0.25">INFEASIBLE</text>`;

  svg.innerHTML=h;
}

buildOtif(); buildDet(); buildHos(); buildCombined();
</script>
</body>
</html>
