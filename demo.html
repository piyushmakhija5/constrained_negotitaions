<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNB — Live Negotiation Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #E6EDF3;
    background: #0d1117;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  #header {
    background: #0d1117;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 100;
    height: 52px;
    position: relative;
    border-bottom: 1px solid #21262d;
  }

  #header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #header-title .logo {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #58A6FF, #3FB950);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: white;
    font-family: 'JetBrains Mono', monospace;
  }

  #header h1 {
    font-size: 16px; font-weight: 600;
    color: #a1a9b3; letter-spacing: -0.2px;
  }
  #header h1 strong { color: #E6EDF3; font-weight: 700; }

  .hdr-tag {
    font-size: 13px; padding: 2px 10px; border-radius: 4px;
    font-weight: 700; vertical-align: middle; letter-spacing: 0.3px;
  }
  .hdr-tag-blue { background: rgba(88,166,255,0.15); color: #58A6FF; }
  .hdr-tag-red { background: rgba(248,81,73,0.15); color: #F85149; }
  .hdr-vs { color: #6e7681; font-weight: 600; margin: 0 8px; font-size: 15px; }
  .hdr-scenario {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #7d8590; background: #21262d; padding: 3px 10px;
    border-radius: 4px; margin-left: 14px; font-weight: 600;
  }

  #controls {
    display: flex; align-items: center; gap: 10px;
  }

  .ctrl-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #a1a9b3;
    padding: 6px 16px; border-radius: 6px;
    font-size: 13px; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: all 0.15s; font-weight: 600;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: white; }
  .ctrl-btn.primary {
    background: #1d4ed8; border-color: #1d4ed8;
    color: white; font-weight: 700;
  }
  .ctrl-btn.primary:hover { background: #2563eb; }

  #speed-control {
    display: flex; align-items: center; gap: 6px;
    color: #6e7681; font-size: 12px; font-weight: 600;
  }
  #speed-slider { width: 70px; accent-color: #58A6FF; cursor: pointer; }
  #speed-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; min-width: 22px; color: #a1a9b3;
  }

  #progress-bar {
    position: absolute; bottom: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, #58A6FF, #3FB950);
    transition: width 0.3s ease; z-index: 1;
  }

  /* ── Main ── */
  #main { flex: 1; display: flex; overflow: hidden; }

  /* ── Chat Panel ── */
  #chat-panel {
    flex: 1; display: flex; flex-direction: column;
    background: #0d1117;
    position: relative; min-width: 0;
  }

  /* Turn indicator — floating top-right */
  #turn-indicator {
    position: absolute;
    top: 12px; right: 20px;
    font-size: 14px; color: #a1a9b3;
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    background: #161b22; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #30363d;
    z-index: 5;
  }

  /* ── Chat Messages ── */
  #chat-messages {
    flex: 1; overflow-y: auto;
    padding: 24px 28px;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
    position: relative;
  }
  #chat-messages::-webkit-scrollbar { width: 5px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .chat-event {
    display: flex;
    flex-direction: column;
    opacity: 0; transform: translateY(8px);
    animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

  /* ── Message Bubbles ── */
  .message-group {
    display: flex; gap: 12px;
    max-width: 78%;
    align-items: flex-end;
    margin: 8px 0;
  }
  .message-group.dispatcher {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .message-group.warehouse {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .avatar-marcus { background: linear-gradient(135deg, #58A6FF, #1d4ed8); }
  .avatar-rita { background: linear-gradient(135deg, #3FB950, #238636); }

  .bubble-wrapper {
    display: flex; flex-direction: column; gap: 4px;
  }
  .dispatcher .bubble-wrapper { align-items: flex-end; }
  .warehouse .bubble-wrapper { align-items: flex-start; }

  .msg-sender {
    font-size: 16px; font-weight: 700; color: #a1a9b3; padding: 0 6px;
  }

  .msg-bubble {
    padding: 14px 20px;
    font-size: 18px; line-height: 1.65;
    letter-spacing: -0.1px; font-weight: 500;
  }
  .dispatcher .msg-bubble {
    background: #1d4ed8;
    color: white;
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 2px 12px rgba(29,78,216,0.4);
  }
  .warehouse .msg-bubble {
    background: #21262d;
    color: #E6EDF3;
    border-radius: 20px 20px 20px 4px;
    border: 1px solid #30363d;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ── Tool Call Cards ── */
  .tool-event {
    align-self: flex-end;
    margin: 4px 0;
    max-width: 620px;
  }

  .tool-card {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: #161b22;
    border-radius: 8px;
    border: 1px solid #E3B341;
    border-left: 4px solid #E3B341;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  .tool-card.infeasible {
    border-left-color: #F85149;
    border-color: #F85149;
    background: #1c1214;
  }

  .tool-label {
    font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: #E3B341;
    flex-shrink: 0;
  }
  .tool-card.infeasible .tool-label { color: #F85149; }

  .tool-slot-time {
    font-weight: 700; color: #E6EDF3; font-size: 20px;
    min-width: 50px;
  }
  .tool-card.infeasible .tool-slot-time { color: #F85149; }

  .tool-badges {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; flex: 1;
  }

  .t-badge {
    padding: 2px 8px; border-radius: 4px;
    font-size: 14px; font-weight: 700;
  }
  .t-badge.cost { background: #21262d; color: #a1a9b3; }
  .t-badge.ok { background: #0d3321; color: #3FB950; }
  .t-badge.fail { background: #3d1418; color: #F85149; }
  .t-badge.warn { background: #3b2e0a; color: #E3B341; }

  .tool-feasibility { font-size: 18px; flex-shrink: 0; }

  /* ── Orchestrator Dividers ── */
  .orch-event {
    align-self: stretch;
    display: flex; align-items: center; gap: 14px;
    margin: 14px 0; padding: 0;
  }
  .orch-line { flex: 1; height: 1px; background: #30363d; }

  .orch-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 18px;
    background: #30363d; color: #E6EDF3;
    border-radius: 100px;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.4px; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .orch-pill.deal {
    background: linear-gradient(135deg, #3FB950, #238636);
    color: white;
  }
  .orch-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #58A6FF; flex-shrink: 0;
  }

  /* ── Center Play Overlay ── */
  #center-play {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: rgba(13,17,23,0.92);
    z-index: 10;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  #center-play.hidden { opacity: 0; pointer-events: none; }

  #center-play-btn {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: #1d4ed8;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 30px rgba(29,78,216,0.5);
    transition: all 0.2s;
  }
  #center-play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 40px rgba(29,78,216,0.6);
  }
  #center-play-btn svg {
    width: 36px; height: 36px; fill: white; margin-left: 4px;
  }
  #center-play-label {
    font-size: 16px; font-weight: 600; color: #a1a9b3;
    letter-spacing: 0.3px;
  }

  /* ── Typing Indicator ── */
  .typing-indicator {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 28px 14px;
    opacity: 0; transition: opacity 0.2s;
  }
  .typing-indicator.active { opacity: 1; }
  .typing-indicator.right { flex-direction: row-reverse; }

  .typing-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
  }
  .typing-bubble {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 18px;
    background: #21262d; border-radius: 18px;
    border: 1px solid #30363d;
  }
  .typing-indicator.right .typing-bubble {
    background: #1d4ed8; border-color: #1d4ed8;
  }
  .typing-bubble span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6e7681;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-indicator.right .typing-bubble span { background: rgba(255,255,255,0.5); }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* ── Right Panel: Dashboard ── */
  #dashboard-panel {
    width: 360px; min-width: 360px;
    background: #0d1117;
    border-left: 1px solid #21262d;
    padding: 10px 14px;
    overflow: hidden;
    display: flex; flex-direction: column; gap: 8px;
  }

  .dash-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 10px 14px;
    transition: all 0.3s;
  }
  .dash-card h4 {
    font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.8px; color: #6e7681;
    margin-bottom: 6px; font-weight: 700;
  }

  /* Offer */
  .offer-display {
    display: flex; align-items: baseline; gap: 10px;
  }
  .offer-slot {
    font-size: 44px; font-weight: 800;
    color: #E6EDF3;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -2px; line-height: 1;
  }
  .offer-meta { display: flex; flex-direction: column; gap: 2px; }
  .offer-label { font-size: 13px; color: #a1a9b3; font-weight: 500; }
  .offer-prev {
    font-size: 13px; color: #6e7681;
    font-family: 'JetBrains Mono', monospace;
    text-decoration: line-through; font-weight: 500;
  }

  /* Cost */
  .cost-display { text-align: center; padding: 2px 0; }
  .cost-amount {
    font-size: 48px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: #E6EDF3;
    letter-spacing: -2px; line-height: 1.1;
    transition: all 0.4s;
  }
  .cost-amount.danger { color: #F85149; }
  .cost-breakdown {
    font-size: 14px; color: #a1a9b3;
    margin-top: 4px; font-weight: 600;
  }

  /* Constraints */
  .constraint-list { display: flex; flex-direction: column; gap: 4px; }
  .cstr-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 10px; border-radius: 6px; background: #0d1117;
  }
  .cstr-name { font-size: 18px; font-weight: 700; color: #E6EDF3; }
  .cstr-badge {
    font-size: 16px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 10px; border-radius: 5px;
  }
  .cstr-na { background: #21262d; color: #6e7681; }
  .cstr-ok { background: #0d3321; color: #3FB950; }
  .cstr-fail { background: #3d1418; color: #F85149; }
  .cstr-warn { background: #3b2e0a; color: #E3B341; }

  /* Pushbacks */
  .pushback-display { display: flex; align-items: center; gap: 10px; }
  .pb-track { flex: 1; display: flex; gap: 4px; }
  .pb-segment {
    flex: 1; height: 8px; border-radius: 4px;
    background: #21262d; transition: all 0.4s;
  }
  .pb-segment.filled { background: #58A6FF; }
  .pb-segment.filled.hot { background: #E3B341; }
  .pb-count {
    font-size: 20px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: #E6EDF3; min-width: 36px; text-align: right;
  }

  /* Score */
  .score-card {
    border: 2px solid #30363d; transition: all 0.5s;
    flex: 1; display: flex; flex-direction: column;
  }
  .score-inner {
    text-align: center; padding: 4px 0;
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }

  .score-eyebrow {
    font-size: 12px; color: #6e7681;
    font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .score-number {
    font-size: 64px; font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    color: #6e7681; letter-spacing: -3px; line-height: 1;
    transition: color 0.4s ease;
  }

  .score-context {
    font-size: 14px; color: #a1a9b3;
    margin-top: 8px; line-height: 1.6; font-weight: 500;
  }
  .score-context strong { color: #F85149; font-weight: 800; }
  .score-context .optimal { color: #3FB950; font-weight: 800; }

  .score-card.revealed {
    border-color: #F85149;
    box-shadow: 0 0 0 6px rgba(248,81,73,0.15);
    animation: scorePulse 1.5s ease 2;
  }
  .score-number.live {
    animation: scoreLiveGlow 2s ease-in-out infinite;
  }
  @keyframes scoreLiveGlow {
    0%, 100% { filter: brightness(1); text-shadow: none; }
    50% { filter: brightness(1.3); text-shadow: 0 0 24px currentColor; }
  }

  .score-card.revealed .score-number {
    animation: scoreConfirm 0.6s ease;
    filter: none; text-shadow: none;
  }
  @keyframes scoreConfirm {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes scorePulse {
    0%, 100% { box-shadow: 0 0 0 6px rgba(248,81,73,0.15); }
    50% { box-shadow: 0 0 0 14px rgba(248,81,73,0.05); }
  }

  /* ── Message highlights ── */
  .hl {
    font-weight: 700;
    border-radius: 3px;
    padding: 0 2px;
  }
  /* On dispatcher (blue) bubbles */
  .dispatcher .hl {
    background: rgba(255,255,255,0.22);
    color: #fff;
    text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.55);
    text-underline-offset: 2px;
  }
  /* On warehouse (dark) bubbles */
  .warehouse .hl {
    background: rgba(227,179,65,0.25);
    color: #E3B341;
    text-decoration: underline;
    text-decoration-color: rgba(227,179,65,0.65);
    text-underline-offset: 2px;
  }

  /* Record button */
  .ctrl-btn.record { background: #da3633; border-color: #da3633; color: white; }
  .ctrl-btn.record:hover { background: #f85149; }
  .ctrl-btn.recording { animation: recordBlink 1s infinite; }
  @keyframes recordBlink { 50% { opacity: 0.6; } }

  /* Flash */
  .dash-card.flash-active {
    background: rgba(88,166,255,0.08);
    border-color: #58A6FF;
    transition: all 0.15s;
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="header-title">
    <div class="logo">N</div>
    <h1>
      <strong style="color:#58A6FF">Marcus</strong> <span class="hdr-tag hdr-tag-blue">Dispatcher</span>
      <span class="hdr-vs">vs</span>
      <strong style="color:#F85149">Rita</strong> <span class="hdr-tag hdr-tag-red">Frustrated Warehouse</span>
    </h1>
  </div>
  <div id="controls">
    <div id="speed-control">
      <span>Speed</span>
      <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1">
      <span id="speed-label">1x</span>
    </div>
    <button class="ctrl-btn record" id="btn-download" onclick="downloadVideo()">&#11015; Download</button>
    <button class="ctrl-btn" id="btn-reset" onclick="resetReplay()">Reset</button>
    <button class="ctrl-btn primary" id="btn-play" onclick="togglePlay()">&#9654;&ensp;Play</button>
  </div>
  <div id="progress-bar" style="width:0%"></div>
</div>

<!-- Main -->
<div id="main">

  <!-- Chat Panel -->
  <div id="chat-panel">
    <div id="turn-indicator">Turn 0 / 9</div>

    <div id="chat-messages">
      <!-- Center play overlay -->
      <div id="center-play" onclick="startFromCenter()">
        <button id="center-play-btn">
          <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        </button>
        <div id="center-play-label">Start Negotiation Replay</div>
      </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">
      <div class="typing-avatar avatar-rita" id="typing-avatar">R</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Dashboard Panel -->
  <div id="dashboard-panel">
    <div class="dash-card" id="card-offer">
      <h4>Current Offer</h4>
      <div class="offer-display">
        <div class="offer-slot" id="dash-slot">--:--</div>
        <div class="offer-meta">
          <div class="offer-label" id="dash-offer-label">waiting...</div>
          <div class="offer-prev" id="dash-prev-slot" style="visibility:hidden">--:--</div>
        </div>
      </div>
    </div>

    <div class="dash-card" id="card-cost">
      <h4>Projected Cost</h4>
      <div class="cost-display">
        <div class="cost-amount" id="dash-cost">$0</div>
        <div class="cost-breakdown" id="dash-cost-detail">Awaiting first offer</div>
      </div>
    </div>

    <div class="dash-card" id="card-constraints">
      <h4>Constraint Status</h4>
      <div class="constraint-list">
        <div class="cstr-row">
          <span class="cstr-name">HOS</span>
          <span class="cstr-badge cstr-na" id="cstr-hos">--</span>
        </div>
        <div class="cstr-row">
          <span class="cstr-name">OTIF</span>
          <span class="cstr-badge cstr-na" id="cstr-otif">--</span>
        </div>
        <div class="cstr-row">
          <span class="cstr-name">Detention</span>
          <span class="cstr-badge cstr-na" id="cstr-det">--</span>
        </div>
      </div>
    </div>

    <div class="dash-card" id="card-pushbacks">
      <h4>Pushbacks Used</h4>
      <div class="pushback-display">
        <div class="pb-track">
          <div class="pb-segment" id="pb-1"></div>
          <div class="pb-segment" id="pb-2"></div>
          <div class="pb-segment" id="pb-3"></div>
          <div class="pb-segment" id="pb-4"></div>
          <div class="pb-segment" id="pb-5"></div>
        </div>
        <div class="pb-count" id="pb-count">0/5</div>
      </div>
    </div>

    <div class="dash-card score-card" id="card-score">
      <h4 id="score-title">Live Score</h4>
      <div class="score-inner" id="score-inner">
        <div class="score-eyebrow">Negotiation Efficiency</div>
        <div class="score-number" id="score-number">&mdash;</div>
        <div class="score-context" id="score-context"></div>
      </div>
    </div>
  </div>
</div>

<script>
const EVENTS = [
  {
    type: 'tool_call',
    slot: '13:00', cost: '$0', otif: 'OK', hos: 'OK',
    feasible: true, dh: false
  },
  {
    type: 'dashboard_update',
    slot: '13:00', cost: '$0', costNum: 0,
    otifStatus: 'ok', otifLabel: 'ON TIME',
    hosStatus: 'ok', hosLabel: 'OK (+120m)',
    detStatus: 'ok', detLabel: '$0',
    costDetail: 'OTIF $0 + Detention $0',
    offerLabel: 'dispatcher request'
  },

// ── State ──
let currentEvent = 0;
let isPlaying = false;
let playTimer = null;
let speed = 1;
let turnCount = 0;
let pushbackCount = 0;

function getDelay(ev) {
  const base = {
    tool_call: 1000,
    message: 2800,
    orchestrator: 1200,
    dashboard_update: 700,
    score_reveal: 4500
  };
  return (base[ev.type] || 1500) / speed;
}

// ── DOM ──
const chatEl = document.getElementById('chat-messages');
const typingEl = document.getElementById('typing-indicator');
const typingAvatar = document.getElementById('typing-avatar');
const turnEl = document.getElementById('turn-indicator');
const progressEl = document.getElementById('progress-bar');
const btnPlay = document.getElementById('btn-play');
const centerPlay = document.getElementById('center-play');

const dashSlot = document.getElementById('dash-slot');
const dashPrev = document.getElementById('dash-prev-slot');
const dashOfferLabel = document.getElementById('dash-offer-label');
const dashCost = document.getElementById('dash-cost');
const dashCostDetail = document.getElementById('dash-cost-detail');
const cstrHos = document.getElementById('cstr-hos');
const cstrOtif = document.getElementById('cstr-otif');
const cstrDet = document.getElementById('cstr-det');
const pbCountEl = document.getElementById('pb-count');
const cardScore = document.getElementById('card-score');

// Speed
document.getElementById('speed-slider').addEventListener('input', e => {
  speed = parseFloat(e.target.value);
  document.getElementById('speed-label').textContent = speed + 'x';
});

// ── Center play button ──
function startFromCenter() {
  centerPlay.classList.add('hidden');
  play();
}

// ── Playback ──
function togglePlay() { isPlaying ? pause() : play(); }

function play() {
  if (currentEvent >= EVENTS.length) resetReplay();
  isPlaying = true;
  btnPlay.innerHTML = '&#10074;&#10074;&ensp;Pause';
  btnPlay.classList.add('primary');
  centerPlay.classList.add('hidden');
  scheduleNext();
}

function pause() {
  isPlaying = false;
  btnPlay.innerHTML = '&#9654;&ensp;Play';
  if (playTimer) clearTimeout(playTimer);
}

function scheduleNext() {
  if (!isPlaying || currentEvent >= EVENTS.length) {
    if (currentEvent >= EVENTS.length) {
      pause();
      if (_recorder && _recorder.state === 'recording') {
        setTimeout(() => _recorder.stop(), 3000);
      }
    }
    return;
  }
  const ev = EVENTS[currentEvent];

  if (ev.type === 'message') {
    showTyping(ev.sender);
    const dur = Math.min(700, 700 / speed);
    playTimer = setTimeout(() => {
      hideTyping();
      render(ev);
      currentEvent++;
      updateProgress();
      playTimer = setTimeout(scheduleNext, getDelay(ev) - dur);
    }, dur);
  } else {
    render(ev);
    currentEvent++;
    updateProgress();
    playTimer = setTimeout(scheduleNext, getDelay(ev));
  }
}

function updateProgress() {
  progressEl.style.width = (currentEvent / EVENTS.length * 100) + '%';
}

// ── Typing ──
function showTyping(sender) {
  if (sender === 'dispatcher') {
    typingAvatar.className = 'typing-avatar avatar-marcus';
    typingAvatar.textContent = 'M';
    typingEl.className = 'typing-indicator right active';
  } else {
    typingAvatar.className = 'typing-avatar avatar-rita';
    typingAvatar.textContent = 'R';
    typingEl.className = 'typing-indicator active';
  }
}
function hideTyping() { typingEl.classList.remove('active'); }

// ── Renderers ──
function render(ev) {
  switch(ev.type) {
    case 'tool_call': renderTool(ev); break;
    case 'message': renderMessage(ev); break;
    case 'orchestrator': renderOrch(ev); break;
    case 'dashboard_update': renderDash(ev); break;
    case 'score_reveal': renderScore(); break;
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderTool(ev) {
  const div = document.createElement('div');
  div.className = 'chat-event';

  const wrap = document.createElement('div');
  wrap.className = 'tool-event';

  const card = document.createElement('div');
  card.className = 'tool-card' + (ev.feasible ? '' : ' infeasible');
  card.innerHTML = `
    <span class="tool-label">TOOL</span>
    <span class="tool-slot-time">${ev.slot}${ev.dh ? ' <span style="font-size:12px;font-weight:500;color:#6e7681">(D&H)</span>' : ''}</span>
    <div class="tool-badges">
      <span class="t-badge cost">${ev.cost}</span>
      <span class="t-badge ${ev.hos === 'OK' ? 'ok' : 'fail'}">HOS ${ev.hos}</span>
      <span class="t-badge ${ev.otif === 'OK' ? 'ok' : 'warn'}">OTIF ${ev.otif}</span>
      ${!ev.feasible ? '<span class="t-badge fail">INFEASIBLE</span>' : ''}
    </div>
    <span class="tool-feasibility">${ev.feasible ? '\u2705' : '\u274C'}</span>
  `;

  wrap.appendChild(card);
  div.appendChild(wrap);
  chatEl.appendChild(div);
}

function renderMessage(ev) {
  const div = document.createElement('div');
  div.className = 'chat-event';

  const group = document.createElement('div');
  group.className = 'message-group ' + ev.sender;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + (ev.sender === 'dispatcher' ? 'avatar-marcus' : 'avatar-rita');
  avatar.textContent = ev.sender === 'dispatcher' ? 'M' : 'R';

  const wrapper = document.createElement('div');
  wrapper.className = 'bubble-wrapper';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = ev.name;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (ev.highlights && ev.highlights.length) {
    let html = ev.text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    ev.highlights.forEach(phrase => {
      const escaped = phrase.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const re = new RegExp(escaped.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      html = html.replace(re, `<span class="hl">${escaped}</span>`);
    });
    bubble.innerHTML = html;
  } else {
    bubble.textContent = ev.text;
  }

  wrapper.appendChild(sender);
  wrapper.appendChild(bubble);
  group.appendChild(avatar);
  group.appendChild(wrapper);
  div.appendChild(group);
  chatEl.appendChild(div);

  turnCount++;
  turnEl.textContent = `Turn ${turnCount} / 9`;
}

function renderOrch(ev) {
  const div = document.createElement('div');
  div.className = 'chat-event';

  const row = document.createElement('div');
  row.className = 'orch-event';
  row.innerHTML = `
    <div class="orch-line"></div>
    <div class="orch-pill${ev.isDeal ? ' deal' : ''}">
      <div class="orch-dot" style="background:${ev.isDeal ? 'white' : '#58A6FF'}"></div>
      ${ev.label}
    </div>
    <div class="orch-line"></div>
  `;

  div.appendChild(row);
  chatEl.appendChild(div);

  if (ev.pushbackNum !== undefined) {
    pushbackCount = ev.pushbackNum;
    for (let i = 1; i <= 5; i++) {
      const seg = document.getElementById('pb-' + i);
      if (i <= pushbackCount) {
        seg.classList.add('filled');
        if (pushbackCount >= 3) seg.classList.add('hot');
      }
    }
    pbCountEl.textContent = pushbackCount + '/5';
  }
}

function computeScore(costNum, hosViolated) {
  if (hosViolated) return 0;
  if (costNum === 0) return 1.0;
  return Math.max(0, 1.0 - costNum / 10600);
}

function scoreColor(s) {
  if (s >= 0.8) return '#3FB950';
  if (s >= 0.3) return '#E3B341';
  return '#F85149';
}

function updateLiveScore(costNum, hosViolated, slot, costDetail) {
  const s = computeScore(costNum, hosViolated);
  const el = document.getElementById('score-number');
  const ctx = document.getElementById('score-context');
  el.textContent = s.toFixed(3);
  el.style.color = scoreColor(s);
  el.classList.add('live');

  let note = '';
  if (hosViolated) note = 'HOS VIOLATION &mdash; score zeroed';
  else if (costNum === 0) note = 'Optimal &mdash; zero cost!';
  else note = costDetail;

  ctx.innerHTML = `Optimal: <span class="optimal">$0</span> at 13:00<br>Current: <strong>$${costNum.toLocaleString()}</strong> at ${slot}<br><br>${note}`;
  flashCard('card-score');
}

function renderDash(ev) {
  flashCard('card-offer');
  flashCard('card-cost');
  flashCard('card-constraints');

  if (ev.prevSlot) {
    dashPrev.textContent = ev.prevSlot;
    dashPrev.style.visibility = 'visible';
  }
  dashSlot.textContent = ev.slot;
  if (ev.offerLabel) dashOfferLabel.textContent = ev.offerLabel;

  dashCost.textContent = ev.cost;
  dashCost.className = 'cost-amount' + (ev.costNum > 0 ? ' danger' : '');
  dashCostDetail.textContent = ev.costDetail;

  setCstr(cstrHos, ev.hosStatus, ev.hosLabel);
  setCstr(cstrOtif, ev.otifStatus, ev.otifLabel);
  setCstr(cstrDet, ev.detStatus, ev.detLabel);

  updateLiveScore(ev.costNum, ev.hosStatus === 'fail', ev.slot, ev.costDetail);
}

function setCstr(el, status, label) {
  el.textContent = label;
  el.className = 'cstr-badge cstr-' + status;
}

function flashCard(id) {
  const el = document.getElementById(id);
  el.classList.add('flash-active');
  setTimeout(() => el.classList.remove('flash-active'), 500);
}

function renderScore() {
  document.getElementById('score-title').textContent = 'Final Score';
  const el = document.getElementById('score-number');
  el.classList.remove('live');
  const ctx = document.getElementById('score-context');
  ctx.innerHTML = `Optimal: <span class="optimal">$0</span> at 13:00<br>Actual: <strong>$10,100</strong> at 14:30<br><br>OTIF was saveable &mdash; but not saved.`;
  cardScore.classList.add('revealed');
}

// ── Reset ──
function resetReplay() {
  pause();
  currentEvent = 0;
  turnCount = 0;
  pushbackCount = 0;
  updateProgress();

  const events = chatEl.querySelectorAll('.chat-event');
  events.forEach(e => e.remove());

  centerPlay.classList.remove('hidden');
  hideTyping();
  turnEl.textContent = 'Turn 0 / 9';

  dashSlot.textContent = '--:--';
  dashPrev.textContent = '--:--';
  dashPrev.style.visibility = 'hidden';
  dashOfferLabel.textContent = 'waiting...';
  dashCost.textContent = '$0';
  dashCost.className = 'cost-amount';
  dashCostDetail.textContent = 'Awaiting first offer';

  cstrHos.textContent = '--'; cstrHos.className = 'cstr-badge cstr-na';
  cstrOtif.textContent = '--'; cstrOtif.className = 'cstr-badge cstr-na';
  cstrDet.textContent = '--'; cstrDet.className = 'cstr-badge cstr-na';

  for (let i = 1; i <= 5; i++) {
    document.getElementById('pb-' + i).classList.remove('filled', 'hot');
  }
  pbCountEl.textContent = '0/5';

  cardScore.classList.remove('revealed');
  document.getElementById('score-title').textContent = 'Live Score';
  document.getElementById('score-number').textContent = '\u2014';
  document.getElementById('score-number').style.color = '#6e7681';
  document.getElementById('score-number').classList.remove('live');
  document.getElementById('score-context').innerHTML = '';

  btnPlay.innerHTML = '&#9654;&ensp;Play';
}

// ── Download Video ──
let _recorder = null;
let _chunks = [];

async function downloadVideo() {
  const btn = document.getElementById('btn-download');

  // If already recording, stop early
  if (_recorder && _recorder.state === 'recording') {
    _recorder.stop();
    return;
  }

  try {
    // preferCurrentTab auto-selects this tab — user just clicks "Share"
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser' },
      preferCurrentTab: true
    });

    _chunks = [];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    _recorder = new MediaRecorder(stream, { mimeType: mime });

    _recorder.ondataavailable = e => {
      if (e.data.size > 0) _chunks.push(e.data);
    };

    _recorder.onstop = () => {
      const blob = new Blob(_chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cnb-negotiation-replay.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      stream.getTracks().forEach(t => t.stop());
      btn.innerHTML = '&#11015; Download';
      btn.classList.remove('recording');
      _recorder = null;
    };

    // Start capture, reset replay, auto-play
    _recorder.start();
    btn.innerHTML = '&#9632; Capturing\u2026';
    btn.classList.add('recording');
    resetReplay();
    centerPlay.classList.add('hidden');
    setTimeout(() => play(), 500);

  } catch (err) {
    console.error('Download capture failed:', err);
    btn.innerHTML = '&#11015; Download';
    btn.classList.remove('recording');
  }
}

// Auto-play if #autoplay hash
if (location.hash === '#autoplay') {
  centerPlay.style.display = 'none';
  setTimeout(() => play(), 100);
}
