<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #faf9f6; color: #0f172a;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  #header {
    background: #0f172a; padding: 0 32px; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #header h1 { font-size: 14px; font-weight: 600; color: #94a3b8; }
  #header h1 strong { color: white; font-weight: 700; }
  .header-tag {
    font-family: 'Caveat', cursive; font-size: 16px; font-weight: 600;
    color: #64748b; background: rgba(255,255,255,0.06);
    padding: 4px 14px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1);
  }

  #canvas-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px 32px;
  }

  svg#story {
    width: 100%; max-width: 1200px; height: auto;
  }

  /* ── Hand-drawn text — HIGH CONTRAST ── */
  .label {
    font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700;
    fill: #0f172a; opacity: 0;
  }
  .label-accent { font-weight: 700; }
  .label-red { fill: #b91c1c; font-weight: 700; }
  .label-green { fill: #047857; font-weight: 700; }
  .label-blue { fill: #1d4ed8; font-weight: 700; }
  .label-cost {
    font-family: 'Caveat', cursive; font-size: 16px;
    fill: #334155; font-weight: 600;
  }

  /* ── Stroke drawing animation base ── */
  .draw {
    stroke-dasharray: var(--len, 800);
    stroke-dashoffset: var(--len, 800);
    fill: none;
  }

  /* ── Scene groups ── */
  .scene { opacity: 1; }
  .scene .draw { transition: none; }

  /* ── Animation classes (added by JS) ── */
  .draw.animate {
    animation: drawIn var(--dur, 0.8s) var(--ease, cubic-bezier(0.4,0,0.2,1)) forwards;
    animation-delay: var(--delay, 0s);
  }
  .label.animate {
    animation: fadeIn 0.5s ease forwards;
    animation-delay: var(--delay, 0s);
  }

  @keyframes drawIn {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ── Bottom bar buttons ── */
  .btn-bar {
    position: fixed; bottom: 24px; right: 32px;
    display: flex; gap: 10px; z-index: 10;
  }
  .btn-bar button {
    background: #0f172a; color: white; border: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 20px; border-radius: 8px; cursor: pointer;
    opacity: 0; transition: opacity 0.4s, background 0.2s;
  }
  .btn-bar button:hover { background: #1e293b; }
  .btn-bar button.show { opacity: 1; }
  .btn-bar button:disabled { opacity: 0.5; cursor: wait; }
  .btn-bar button.recording { background: #dc2626; }
  .btn-bar button.recording:hover { background: #b91c1c; }

  /* Flash for DELAYED label */
  .flash {
    animation: flashRed 0.6s ease 2;
    animation-delay: var(--delay, 0s);
  }
  @keyframes flashRed {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Signal waves pulse */
  .pulse { opacity: 0; }
  .pulse.animate {
    animation: pulseFade 0.6s ease 3;
    animation-delay: var(--delay, 0s);
  }
  @keyframes pulseFade {
    0% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }
</style>

<script>
(function() {
  // === CONFIG ===
  const ANIM_MS = 13000;
  const CANVAS_SCALE = 2;

  // === REFS ===
  const svg = document.getElementById('story');
  const draws = svg.querySelectorAll('.draw');
  const labels = svg.querySelectorAll('.label');
  const pulses = svg.querySelectorAll('.pulse');
  const replayBtn = document.getElementById('replay');
  const downloadBtn = document.getElementById('download');

  // === FONT PRE-LOAD (for canvas recording) ===
  let fontDataURI = null;

  async function preloadFont() {
    try {
      const cssResp = await fetch(
        'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap',
        { headers: { 'Accept': 'text/css' } }
      );
      const cssText = await cssResp.text();
      const m = cssText.match(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+\.woff2)\)/);
      if (!m) return;
      const fontResp = await fetch(m[1]);
      const buf = await fontResp.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      fontDataURI = 'data:font/woff2;base64,' + btoa(binary);
    } catch (e) {
      // Silently fall back — recording will use system cursive
    }
  }

  // === PATH MEASUREMENT ===
  function measurePaths() {
    draws.forEach(el => {
      let len;
      if (el.tagName === 'circle') {
        len = Math.ceil(2 * Math.PI * parseFloat(el.getAttribute('r')));
      } else if (el.getTotalLength) {
        len = Math.ceil(el.getTotalLength());
      } else {
        return;
      }
      el.style.setProperty('--len', len);
      el.setAttribute('stroke-dasharray', len);
      el.setAttribute('stroke-dashoffset', len);
    });
  }

  // === ANIMATION ===
  function resetAll() {
    [draws, labels, pulses].forEach(list => {
      list.forEach(el => {
        el.classList.remove('animate');
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });
    });
    labels.forEach(el => { el.style.opacity = '0'; });
    replayBtn.classList.remove('show');
    downloadBtn.classList.remove('show');
  }

  function startAnimation() {
    resetAll();
    measurePaths();
    requestAnimationFrame(() => {
      draws.forEach(el => el.classList.add('animate'));
      labels.forEach(el => el.classList.add('animate'));
      pulses.forEach(el => el.classList.add('animate'));
    });
    setTimeout(() => {
      replayBtn.classList.add('show');
      downloadBtn.classList.add('show');
    }, 12000);
  }

  // === RECORDING ===
  function buildFrameSVG() {
    const clone = svg.cloneNode(true);
    clone.removeAttribute('id');

    const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    const fontFace = fontDataURI
      ? "@font-face{font-family:'Caveat';src:url(" + fontDataURI + ") format('woff2');font-weight:100 900;}"
      : '';
    styleEl.textContent = fontFace + "\n" +
      ".draw{fill:none;}" +
      ".label{font-family:'Caveat',cursive;fill:#0f172a;}" +
      ".label-red{fill:#b91c1c;}" +
      ".label-green{fill:#047857;}" +
      ".label-blue{fill:#1d4ed8;}" +
      ".label-cost{font-family:'Caveat',cursive;fill:#334155;}";
    clone.insertBefore(styleEl, clone.firstChild);

    const srcDraws = svg.querySelectorAll('.draw');
    const dstDraws = clone.querySelectorAll('.draw');
    srcDraws.forEach((src, i) => {
      const cs = getComputedStyle(src);
      dstDraws[i].style.strokeDashoffset = cs.strokeDashoffset;
      dstDraws[i].style.strokeDasharray = cs.strokeDasharray;
      dstDraws[i].classList.remove('animate');
      dstDraws[i].style.animationName = 'none';
    });

    const srcLabels = svg.querySelectorAll('.label');
    const dstLabels = clone.querySelectorAll('.label');
    srcLabels.forEach((src, i) => {
      dstLabels[i].style.opacity = getComputedStyle(src).opacity;
      dstLabels[i].classList.remove('animate', 'flash');
      dstLabels[i].style.animationName = 'none';
    });

    const srcPulses = svg.querySelectorAll('.pulse');
    const dstPulses = clone.querySelectorAll('.pulse');
    srcPulses.forEach((src, i) => {
      dstPulses[i].style.opacity = getComputedStyle(src).opacity;
      dstPulses[i].classList.remove('animate');
      dstPulses[i].style.animationName = 'none';
    });

    return new XMLSerializer().serializeToString(clone);
  }

  function drawFrameToCanvas(ctx, canvas) {
    return new Promise(resolve => {
      const svgStr = buildFrameSVG();
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = '#faf9f6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve();
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(); };
      img.src = url;
    });
  }

  async function doRecording() {
    if (typeof MediaRecorder === 'undefined') {
      alert('MediaRecorder not supported. Use Chrome or Edge.');
      return;
    }

    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Recording\u2026';
    downloadBtn.classList.add('recording', 'show');
    replayBtn.classList.remove('show');

    const canvas = document.createElement('canvas');
    canvas.width = 1100 * CANVAS_SCALE;
    canvas.height = 300 * CANVAS_SCALE;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#faf9f6';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5_000_000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

    recorder.start();
    startAnimation();
    downloadBtn.classList.add('show');

    const t0 = performance.now();
    let active = true;
    let busy = false;

    function loop() {
      if (!active) return;
      if (busy) { requestAnimationFrame(loop); return; }
      if (performance.now() - t0 >= ANIM_MS) {
        active = false;
        recorder.stop();
        return;
      }
      busy = true;
      drawFrameToCanvas(ctx, canvas).then(() => {
        busy = false;
        requestAnimationFrame(loop);
      });
    }
    requestAnimationFrame(loop);

    await new Promise(resolve => {
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cnb-story.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        resolve();
      };
    });

    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download Video';
    downloadBtn.classList.remove('recording');
    replayBtn.classList.add('show');
    downloadBtn.classList.add('show');
  }

  // === INIT ===
  replayBtn.addEventListener('click', startAnimation);
  downloadBtn.addEventListener('click', doRecording);
  preloadFont();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(startAnimation);
  } else {
    window.addEventListener('load', startAnimation);
  }
})();
</script>
</body>
</html>
